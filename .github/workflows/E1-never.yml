{
  "name": "Study E1 never",
  "run-name": "E1/never ${{ github.event_name }} ${{ github.event.ref || github.ref }}",
  "on": {
    "push": {
      "branches": [
        "study-delete"
      ],
      "paths": [
        "E1/never.txt"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "marker": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "env": {
        "CASE": "E1",
        "VARIANT": "never",
        "WORKFLOW_REF": "${{ github.workflow_ref }}",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}"
      },
      "steps": [
        {
          "name": "Native identity marker",
          "run": "python3 - <<'PY'\nimport json,os\nkeys=['CASE','VARIANT','GITHUB_EVENT_NAME','GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','WORKFLOW_REF','WORKFLOW_SHA']\nprint('STUDY_MARKER '+json.dumps({k:os.environ.get(k) for k in keys},sort_keys=True))\nPY"
        }
      ]
    }
  }
}
